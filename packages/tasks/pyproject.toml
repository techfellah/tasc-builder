[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tasc-tasks"
version = "0.1.0"
description = "TASC tasks package skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tasc-core", "tasc-agents"]

[tool.hatch.build.targets.wheel]
packages = ["tasc_tasks"]
