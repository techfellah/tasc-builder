[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tasc-projects"
version = "0.1.0"
description = "TASC projects package skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tasc-core"]

[tool.hatch.build.targets.wheel]
packages = ["tasc_projects"]
