[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tasc-builder"
version = "0.1.0-alpha.1"
description = "Techfellah AI Software Company Builder"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Techfellah" },
]
dependencies = []

keywords = [
  "ai",
  "multi-agent",
  "software-company",
  "automation",
  "yaml",
  "orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/techfellah/tasc-builder"
Repository = "https://github.com/techfellah/tasc-builder"
Issues = "https://github.com/techfellah/tasc-builder/issues"


[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.hatch.build.targets.wheel]
packages = ["tasc_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]